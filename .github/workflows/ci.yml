name: CI — GitHub Review Agent

# Runs on every push to any branch, and on pull requests targeting main
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true          # Stop all jobs immediately on first failure
      matrix:
        python-version: ["3.10"]   # Match your Azure App Service runtime

    env:
      # Fake secrets so app config loads without crashing in CI
      WEBHOOK_SECRET: test_secret
      GITHUB_TOKEN: fake_token
      AZURE_OPENAI_ENDPOINT: https://fake.openai.azure.com/
      AZURE_OPENAI_KEY: fake_key
      AZURE_OPENAI_DEPLOYMENT: gpt-5-mini
      DATABASE_URL: postgresql://fake:fake@localhost/fake
      ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: fake_jwt_secret

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the exact Python version we run in production
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Cache pip dependencies — speeds up CI from ~60s to ~10s after first run
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      # 5. Run tests with coverage — fail fast on first failure (-x flag)
      - name: Run tests
        run: |
          python -m pytest tests/ -v -x \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60

      # 6. Upload coverage report as artifact (visible in GitHub Actions UI)
      - name: Upload coverage report
        if: always()    # Upload even if tests fail — useful for debugging
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7